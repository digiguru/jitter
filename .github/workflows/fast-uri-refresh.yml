name: One-shot fast-uri refresh

on:
  push:
    branches:
      - fix/fast-uri-3.1.7

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/fast-uri-3.1.7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Pin patched fast-uri
        run: npm pkg set 'overrides.fast-uri=3.1.7'
      - name: Regenerate lockfile
        run: npm install --package-lock-only
      - name: Remove one-shot workflow
        run: rm .github/workflows/fast-uri-refresh.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: upgrade fast-uri to 3.1.7'
          git push
