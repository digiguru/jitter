<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Audio Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="container">
        <section id="controls" aria-labelledby="options-heading">
            <h1 id="options-heading">Options</h1>
            <label for="trackPosition">
                Track Position: <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
            </label>
            <input disabled type="range" id="trackPosition" value="0" min="0" max="100" step="1">
            <button disabled id="playPauseBtn" class="play-pause-btn" type="button" aria-label="Play audio">Play</button>
            <label for="audio-file">Audio file</label>
            <input type="file" id="audio-file" accept="audio/mpeg,.mp3">
        </section>

        <section id="canvas-container" aria-labelledby="output-heading">
            <h1 id="output-heading">Output</h1>
            <button id="start-animation" type="button">Start</button>
            <canvas id="canvas"></canvas>
        </section>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
