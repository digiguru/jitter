<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Jitter waveform J">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E4C5F"/>
      <stop offset="1" stop-color="#333333"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08AEEA"/>
      <stop offset="1" stop-color="#2AF598"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="236" height="236" rx="48" fill="url(#bg)"/>

  <!-- Waveform: deliberately centred and evenly spaced -->
  <circle cx="44" cy="128" r="9" fill="#8870D8"/>
  <rect x="63" y="108" width="16" height="40" rx="8" fill="#6C9BEF"/>
  <rect x="91" y="83" width="18" height="90" rx="9" fill="#08AEEA"/>
  <rect x="121" y="103" width="18" height="50" rx="9" fill="#14D5CF"/>

  <!-- Final waveform stroke curls into a compact J -->
  <path d="M167 109V157C167 181 181 196 202 196C223 196 232 180 232 158V94"
        fill="none"
        stroke="url(#wave)"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
